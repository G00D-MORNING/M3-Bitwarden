[package]
name = "m3-proton-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Proton Authenticator sync for M3 Bitwarden: Proton session fork, key unlock, entry sync."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "m3_proton_core"

[dependencies]
# Proton's own open-source authenticator core (GPL-3.0): entry model, AES-GCM entry
# encryption, TOTP code generation. No network code in it.
proton-authenticator = { git = "https://github.com/protonpass/proton-pass-common", rev = "17be2ce53761054d818b696dfcc5afbaa016966c", default-features = false }
pgp = "0.14"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
urlencoding = "2"
thiserror = "1"
zeroize = "1"
uniffi = { version = "=0.32.0", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
