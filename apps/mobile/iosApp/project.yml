# Xcode project for M3 Bitwarden (iOS app + AutoFill extension).
# Generate on the Mac with:  brew install xcodegen && cd apps/mobile/iosApp && xcodegen
name: iosApp
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: $(inherited) -framework Shared
packages:
  # Official Bitwarden SDK, same revision as the Bitwarden iOS app (4.0.0-9679-8da8618).
  BitwardenSdk:
    url: https://github.com/bitwarden/sdk-swift
    revision: d9afe6f534abab5f0dc7934060f89b83155d21e0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: $(APP_NAME)
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: BitwardenSdk
      - target: CredentialProvider
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then exit 0; fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  CredentialProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: CredentialProvider
        excludes: ["*.entitlements"]
      - path: Common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).CredentialProvider
        PRODUCT_NAME: CredentialProvider
        INFOPLIST_FILE: CredentialProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: CredentialProvider/CredentialProvider.entitlements
    dependencies:
      - package: BitwardenSdk
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then exit 0; fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
