<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sicherer Link</title>
<link rel="stylesheet" href="/view.css">
<script src="/view.js" defer></script>
</head>
<body>
<main>
  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Z"/></svg>
  </div>
  <h1 id="title">Sicherer Link</h1>
  <p id="lead" class="lead">Jemand hat dir verschlüsselte Zugangsdaten geschickt. Sie werden erst in deinem Browser entschlüsselt.</p>

  <section id="start" class="card">
    <p class="small" id="views-hint">Das Öffnen zählt als Aufruf. Manche Links lassen sich nur einmal öffnen.</p>
    <form id="pw-form" hidden>
      <label for="pw">Dieser Link ist mit einem Passwort geschützt.</label>
      <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Passwort">
    </form>
    <button id="open" class="primary" type="button">Anzeigen</button>
  </section>

  <section id="result" class="card" hidden>
    <h2 id="name"></h2>
    <div id="fields"></div>
    <button id="copy-all" class="tonal" type="button">Alles kopieren</button>
  </section>

  <p id="error" class="error" role="alert" hidden></p>
  <p class="foot">Ende-zu-Ende verschlüsselt. Der Schlüssel steht nur im Link und wird nie an den Server gesendet.</p>
</main>
</body>
</html>
