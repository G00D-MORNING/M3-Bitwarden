# Public front for secure links (passwort.*). Serves the viewer and exactly two Vaultwarden calls:
#   POST /send-token?id=<accessId>[&h=<password hash>]  -> identity token, grant_type fixed to send_access
#   POST /api/sends/access (Bearer send token)          -> the encrypted send
# The token request body is built here from the checked arguments; whatever the browser sends is
# dropped, so password logins (grant_type=password) are impossible through this domain.
# Everything else is 404.
limit_req_zone $http_cf_connecting_ip zone=sendaccess:1m rate=10r/m;

map $arg_h $send_pw {
    ""      "";
    default "&password_hash_b64=$arg_h";
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 4k;
    access_log off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = / { limit_except GET HEAD { deny all; } try_files /index.html =404; }
    location = /view.js { limit_except GET HEAD { deny all; } }
    location = /view.css { limit_except GET HEAD { deny all; } }

    location = /send-token {
        limit_except POST { deny all; }
        limit_req zone=sendaccess burst=5 nodelay;
        limit_req_status 429;
        if ($arg_id !~ "^[A-Za-z0-9_-]{22}$") { return 400; }
        if ($arg_h !~ "^[A-Za-z0-9%_.-]{0,96}$") { return 400; }
        proxy_pass_request_body off;
        proxy_method POST;
        proxy_set_header Content-Type "application/x-www-form-urlencoded";
        proxy_set_body "grant_type=send_access&client_id=send&scope=api.send.access&send_id=$arg_id$send_pw";
        proxy_set_header Host tresor.jochenderrochen.de;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://m3b-vaultwarden:8080/identity/connect/token;
    }

    location = /api/sends/access {
        limit_except POST { deny all; }
        limit_req zone=sendaccess burst=5 nodelay;
        limit_req_status 429;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host tresor.jochenderrochen.de;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://m3b-vaultwarden:8080;
    }

    location / { return 404; }
}
